<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Casino Virtual</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="no-select.css">
    <style>
        /* ============================================
           CONTRÔLE MUSIQUE (inline)
           ============================================ */
        .music-controls {
            background: linear-gradient(135deg, rgba(43, 10, 74, 0.6), rgba(13, 15, 27, 0.8));
            border: 2px solid rgba(241, 196, 15, 0.4);
            border-radius: 16px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .music-controls h3 {
            font-size: 0.85rem;
            color: #f1c40f;
            letter-spacing: 1.5px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .music-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(13, 15, 27, 0.5);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(241, 196, 15, 0.2);
        }

        .music-toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #d1c4e9;
        }

        .music-toggle-label .music-toggle-icon {
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .music-toggle-label.active .music-toggle-icon {
            transform: scale(1.15);
        }

        .music-switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 30px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .music-switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .music-switch .slider {
            position: absolute;
            inset: 0;
            background: #444;
            border-radius: 30px;
            transition: background 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .music-switch .slider::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 4px;
            top: 4px;
            background: linear-gradient(135deg, #fff, #ddd);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .music-switch input:checked + .slider {
            background: linear-gradient(135deg, #f1c40f, #d35400);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2), 0 0 15px rgba(241, 196, 15, 0.5);
        }

        .music-switch input:checked + .slider::before {
            transform: translateX(24px);
            background: linear-gradient(135deg, #fff, #ffe98a);
        }

        .music-volume-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(13, 15, 27, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(241, 196, 15, 0.2);
            transition: opacity 0.3s ease;
        }

        .music-volume-wrap.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .music-volume-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #b39ddb;
            font-weight: 700;
        }

        .music-volume-value {
            color: #f1c40f;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            font-size: 0.85rem;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .volume-icon {
            font-size: 1rem;
            color: #f1c40f;
            flex-shrink: 0;
        }

        .ambient-volume {
            flex: 1;
            height: 6px;
            background: #4a1570;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .ambient-volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f1c40f, #ff8800);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
            transition: transform 0.15s ease;
        }

        .ambient-volume::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .ambient-volume::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f1c40f, #ff8800);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="btn-back">← Retour au Lobby</a>
        
        <h2>CONNEXION</h2>

        <div id="logged-section" class="hidden">
            <p class="welcome-text">Connecté en tant que : <strong id="user-display"></strong></p>
            <button id="logout-btn" class="btn-submit btn-logout">SE DÉCONNECTER</button>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">Adresse mail</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe" required>
            </div>

            <button type="submit" class="btn-submit">SE CONNECTER</button>
        </form>

        <p id="error-message" class="message"></p>

        <div class="auth-footer" id="footer-links">
            <span>Pas encore de compte ?</span>
            <a href="inscription.html" class="auth-link">Créer un compte</a>
        </div>

        <!-- ====== CONTRÔLE MUSIQUE ====== -->
        <div class="music-controls">
            <h3>🎵 Musique de fond</h3>

            <div class="music-toggle-row">
                <div class="music-toggle-label" id="music-label">
                    <span class="music-toggle-icon" id="music-icon">🎵</span>
                    <span id="music-status-text">Musique activée</span>
                </div>
                <label class="music-switch">
                    <input type="checkbox" id="ambient-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="music-volume-wrap" id="volume-wrap">
                <div class="music-volume-header">
                    <span>Volume</span>
                    <span class="music-volume-value" id="ambient-percent">40%</span>
                </div>
                <div class="volume-row">
                    <span class="volume-icon">🔊</span>
                    <input type="range" id="ambient-volume" class="ambient-volume" min="0" max="1" step="0.05" value="0.4">
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="sounds.js"></script>
</body>
</html>
